name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      # Let every linter finish so one run reports all problems at once.
      fail-fast: false
      matrix:
        language: [html, css, js]
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install lint tools
        run: npm ci

      - name: Run ${{ matrix.language }} linter
        run: npm run lint:${{ matrix.language }}
